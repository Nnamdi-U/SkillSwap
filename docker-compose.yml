services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: skillswap
      POSTGRES_PASSWORD: skillswap
      POSTGRES_DB: skillswap
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillswap"]
      interval: 5s
      timeout: 5s
      retries: 5

  identity-profile-service:
    build: ./identity-profile-service
    environment:
      DATABASE_URL: postgresql+psycopg://skillswap:skillswap@postgres:5432/identity_profiles_db
    depends_on:
      postgres:
        condition: service_healthy

  session-service:
    build: ./session-service
    environment:
      DATABASE_URL: postgresql+psycopg://skillswap:skillswap@postgres:5432/sessions_db
      IDENTITY_SERVICE_URL: http://identity-profile-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      identity-profile-service:
        condition: service_started
      notification-service:
        condition: service_started

  notification-service:
    build: ./notification-service
    environment:
      DATABASE_URL: postgresql+psycopg://skillswap:skillswap@postgres:5432/notifications_db
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - identity-profile-service
      - session-service
      - notification-service

volumes:
  postgres-data:
